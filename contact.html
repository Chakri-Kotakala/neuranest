<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo/x-icon runove.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Runova</title>
  <link rel="stylesheet" href="style.css" />
  <!-- AOS Library CSS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">
    <a href="index.html">
    <img src="/logo/runova logo.png" alt="NeuraNest" class="logo-img" />
    </a>
    </div> 

    <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    <nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="contact">
    <h1 class="section-title">Get in Touch</h1>
    <p class="contact-subtitle">We’d love to hear from you. Send us a message and we'll get back soon.</p>

    <form class="contact-form" action="https://formspree.io/f/mgvydojq" method="post">
      <p id="form-message" style="margin-top: 1rem; display: none; color: #4ade80;">
  ✅ Message sent! We'll get back to you soon.
      </p>
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Runova. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <!-- AOS Library JS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    once: false, // Animate only once
    offset: 100, // Distance before trigger
    duration: 800, // Animation duration in ms
  });
</script>

<!-- WhatsApp Chatbot Widget -->
<script>
  (function () {
    var options = {
      whatsapp: "+917093586231", // Replace with your WhatsApp number
      position: "right", 
      call_to_action: "Chat with us", 
      title: "NeuraNest Support",
      subtitle: "Ask us anything, we're here to help!",
      auto_open: false, 
      width: "320",
      welcome_message: "Hi 👋 How can I help you today?",
      zIndex: 999999,
    };

    var proto = document.location.protocol, host = "whatshelp.io", url = proto + "//static." + host;
    var s = document.createElement('script'); s.type = 'text/javascript'; s.async = true; s.src = url + '/widget-send-button/js/init.js';
    s.onload = function () { WhWidgetSendButton.init(host, proto, options); };
    var x = document.getElementsByTagName('script')[0]; x.parentNode.insertBefore(s, x);
  })();
</script>


 <!-- ✅ Stylish WhatsApp Button: Green Icon + Glow Animation -->
<a href="https://wa.me/917093586231?text=Hello%20NeuraNest%2C%20I%27m%20looking%20for%20AI%20automation%20solutions%20for%20my%20business.%20Please%20share%20the%20details."
   class="whatsapp-float-pro" 
   target="_blank" 
   title="Chat with us on WhatsApp">
  <div class="whatsapp-icon-wrapper">
    <img src="https://img.icons8.com/color/96/25D366/whatsapp--v1.png" alt="WhatsApp" />
  </div>
</a>

<style>
/* WhatsApp Button Position */
.whatsapp-float-pro {
  position: fixed;
  bottom: 25px;
  right: 25px;
  z-index: 9999;
  text-decoration: none;
}

/* Wrapper: Rounded, Animated, Glow */
.whatsapp-icon-wrapper {
  height: 70px;
  width: 70px;
  border-radius: 50%;
  background: linear-gradient(145deg, #5d5d5e, #3c3c43);
  display: flex;
  justify-content: center;
  align-items: center;
  animation: pulseGlow 2s infinite ease-in-out;
  box-shadow: 0 0 15px rgba(233, 236, 234, 0.25);
  transition: transform 0.3s ease;
}

/* WhatsApp Icon (Original Green) */
.whatsapp-icon-wrapper img {
  height: 40px;
  width: 40px;
}

/* Glowing + Scaling Animation */
@keyframes pulseGlow {
  0% {
    transform: scale(1);
    box-shadow: 0 0 10px rgba(241, 244, 243, 0.25);
  }
  50% {
    transform: scale(1.12);
    box-shadow: 0 0 24px rgba(243, 246, 245, 0.5);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 10px rgba(232, 236, 234, 0.25);
  }
}
</style>

</body>
</html>
