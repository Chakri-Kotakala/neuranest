<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | NeuraNest</title>
  <link rel="stylesheet" href="style.css" />
  <!-- AOS Library CSS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">NeuraNest</div>
    <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    <nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="contact">
    <h1 class="section-title">Get in Touch</h1>
    <p class="contact-subtitle">We’d love to hear from you. Send us a message and we'll get back soon.</p>

    <form class="contact-form" action="https://formspree.io/f/mgvydojq" method="post">
      <p id="form-message" style="margin-top: 1rem; display: none; color: #4ade80;">
  ✅ Message sent! We'll get back to you soon.
      </p>
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 NeuraNest. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <!-- AOS Library JS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    once: false, // Animate only once
    offset: 100, // Distance before trigger
    duration: 800, // Animation duration in ms
  });
</script>

</body>
</html>
